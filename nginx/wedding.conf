# 婚礼照片收集站 nginx 配置
# 关键点：
#   1. dav_methods PUT DELETE -> 前端直接上传/删除照片到 /uploads/，无需后端
#   2. autoindex_format json -> 相册页通过 GET /uploads/ 获取图片列表
# 注意：标准发行版（CentOS/Ubuntu 官方源、Docker 官方镜像）的 nginx 均自带
#       ngx_http_dav_module，无需重新编译。

server {
    listen       80;
    server_name  wedding.example.com;   # 改成你的域名或服务器IP

    # dist 打包产物的部署目录
    root   /var/www/wedding/dist;
    index  index.html;

    # 单张上传上限（压缩后一般不会超过 1M，留足余量）
    client_max_body_size 20m;

    # 照片目录：可写（PUT 上传 / DELETE 删除）+ 可读列表（autoindex JSON）
    location /uploads/ {
        autoindex on;
        autoindex_format json;

        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw group:r all:r;

        # 列表请求不缓存，保证刷新能看到最新照片
        add_header Cache-Control "no-store";
    }

    # 前端静态资源（Hash 路由，无需 rewrite）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ----------------------------------------------------------------
# 可选：给上传加 Basic Auth 保护（更严谨，按需启用）
# 1. 生成密码文件：
#    htpasswd -c /etc/nginx/.htpasswd wedding
# 2. 在上面的 location /uploads/ 中追加：
#    auth_basic "Wedding Upload";
#    auth_basic_user_file /etc/nginx/.htpasswd;
# 注意：启用后读取列表也需要密码，且前端需同步携带凭证，
#       婚礼私用场景建议保持默认开放即可。
# ----------------------------------------------------------------
